<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Slides</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    body { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
    h1 { margin-bottom: 12px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { color: #556079; line-height: 1.7; }
    .deck {
      display: block;
      margin-top: 32px;
      padding: 24px;
      border: 1px solid #dbe1ec;
      border-radius: 14px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(29, 45, 77, 0.08);
    }
    .deck:hover { border-color: #315efb; }
    .deck strong { display: block; margin-bottom: 8px; font-size: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>My Slides</h1>
    <p>使用 Markdown 和 reveal.js 制作的在线演示文稿。</p>
    <a class="deck" href="slides/mgno/">
      <strong>Multi-scale Gaussian Neural Operator (MGNO)</strong>
      <span>打开演示文稿 →</span>
    </a>
  </main>
</body>
</html>
